# Runs the whole test suite (npm test: node --test) on Linux and Windows with Node 22, at every push and pull request.
# The client has no dependencies to install. Nothing here spends money or needs a secret. Keep the job's name ("test")
# stable: required checks, once he sets them, name it.
# With the matrix, GitHub names the checks "test (ubuntu-latest)" and "test (windows-latest)": required checks name those two.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: npm test
